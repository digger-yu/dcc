[package]
name    = "dcc"
version = "0.1.0"
edition = "2021"
authors = ["DCC Contributors"]
description = "DCC: A suckless C compiler. Faster than GCC for the same job."
license    = "Apache-2.0"

[features]
# 启用需要 GCC 源码树的集成测试 (libdecnumber 等)
gcc_src = []

[profile.release]
opt-level = 3
lto       = "thin"
strip     = "symbols"
panic     = "abort"

[profile.dev]
opt-level = 0
debug     = true

[dependencies]
# 零外部依赖:仅使用 Rust std。这是 suckless 哲学的一部分。
# 所有"基础设施"(解析器、IR、ELF 生成) 都自己写。

[[bin]]
name = "dcc"
path = "src/main.rs"

[[bin]]
name = "fixdep"
path = "src/fixdep.rs"

[workspace]
