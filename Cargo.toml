[package]
name    = "dcc"
version = "0.1.0"
edition = "2021"
authors = ["digger-yu@outlook.com"]
description = "DCC: Digger C compiler. A suckless C compiler."
license    = "Apache-2.0"

[features]
legacy-strip-debug = []
default            = []
arm                = []
mips               = []
all-backends       = ["arm", "mips"]

[profile.release]
opt-level       = 3
lto             = false
codegen-units   = 16
strip           = "symbols"
panic           = "abort"

[profile.dev]
opt-level = 0
debug     = true

[dependencies]
elf          = "0.8"
anyhow       = "1"
miniz_oxide  = "0.8"
zstd         = "0.13"
serde        = { version = "1.0", features = ["derive"] }
toml         = "0.8"
# libm: 编译期常量折叠 __builtin_<math>* 用 (const_eval)。宿主 libm 在
# 编译期不可调用, 这里用 Rust 纯实现提供 erf/tgamma/nextafter 等 std 缺失项。
libm         = "0.2"

[[bin]]
name = "dcc"
path = "src/main.rs"

[[bin]]
name = "fixdep"
path = "src/fixdep.rs"

[workspace]
default-members = ["."]
members         = []
