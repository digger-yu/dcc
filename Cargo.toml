[package]
name    = "dcc"
version = "0.1.0"
edition = "2021"
authors = ["digger-yu@outlook.com"]
description = "DCC: Digger C compiler. A suckless C compiler."
license    = "Apache-2.0"

[features]
# GCC source tree integration tests (libdecnumber, etc.)
gcc_src = []

# 历史遗留的空 feature 别名: aarch64/arm/mips/mips64/riscv64 后端现在**无条件**
# 参与构建(见 src/codegen/mod.rs), 这些名字仅为兼容旧脚本/CI 调用而保留, 不再
# 控制任何代码路径。新代码请使用运行期 FeatureSet 能力查询, 不要再加 gate。
default = []
arm = []
mips = []
# 同时打开两个家族
all-backends = ["arm", "mips"]

[profile.release]
opt-level = 3
lto       = false
codegen-units = 16
strip     = "symbols"
panic     = "abort"

[profile.dev]
opt-level = 0
debug     = true

[dependencies]
# ELF parsing/generation (internal module)
elf = "0.8"
# Error handling
anyhow = "1"
# Minimal external dependencies for DWARF compression
miniz_oxide = "0.8"
zstd = "0.13"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[[bin]]
name = "dcc"
path = "src/main.rs"

[[bin]]
name = "fixdep"
path = "src/fixdep.rs"

[workspace]
default-members = ["."]
members = [
    # Empty on purpose - main package doesn't use workspace members
]
exclude = [
    "scripts/codegen-gen",
]
