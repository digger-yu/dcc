# GitHub Actions Workflow: Linux 内核编译基准测试 + 自举验证
# 第一性原理:
#   1. 自举: dcc 必须能编译 dcc 自己,这是编译器正确性的最高验证。
#   2. 性能: 同样的源码 (linux-6.6 LTS, defconfig, -O2), DCC 应当比 GCC 快。
#   3. 趋势: 每次 push / PR / schedule 跑一次,自动累积历史。
#
# 触发方式: push, pull_request, schedule (每日), workflow_dispatch (手动)

name: DCC Kernel Compilation Benchmark

on:
  push:
    branches: [main, develop, "feat/**", "perf/**"]
  pull_request:
    branches: [main, develop]
  schedule:
    # 每天 UTC 02:00 跑一次,积累性能趋势
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Linux kernel version to compile"
        required: false
        default: "6.6.3"
        type: string
      optimization_level:
        description: "Optimization level (O0/O1/O2/O3)"
        required: false
        default: "O2"
        type: choice
        options: [O0, O1, O2, O3]
      parallel_jobs:
        description: "Parallel make jobs (1-8)"
        required: false
        default: "4"
        type: string
      use_paid_runner:
        description: "Use paid GitHub-hosted large runner for fair benchmark"
        required: false
        default: "false"
        type: boolean
      skip_selfhost:
        description: "Skip self-hosting (bootstrap) check"
        required: false
        default: "false"
        type: boolean

# 防止同时跑两个 (会浪费免费分钟)
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_VERSION_DEFAULT: "6.6.3"
  OPT_LEVEL_DEFAULT: "O2"
  PARALLEL_JOBS_DEFAULT: "4"

jobs:
  # ------------------------------------------------------------
  # Job 1: 自举验证 - 用 dcc 编译 dcc
  # 第一性原理: 自举通过 = 编译器实现自洽 = 阶段性胜利
  # ------------------------------------------------------------
  bootstrap:
    name: "Bootstrap (dcc builds dcc)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build dcc (host build with rustc)
        run: |
          cargo build --release
          mkdir -p bin
          cp target/release/dcc bin/dcc
          ls -la bin/dcc
          ./bin/dcc --version

      - name: Stage compiler source
        run: |
          # 排除 target/ 和 .workbuddy/ 减少传输
          rsync -a --exclude='target' --exclude='.git' --exclude='.workbuddy' \
                --exclude='.github' --exclude='tests' --exclude='docs' \
                ./ /tmp/dcc-source/
          echo "Source size: $(du -sh /tmp/dcc-source | cut -f1)"

      - name: Bootstrap dcc with itself
        run: |
          cd /tmp/dcc-source
          mkdir -p /tmp/dcc-bootstrap
          # 修正路径,让内部 cargo 配置不冲突
          rm -rf target Cargo.lock
          export PATH="/tmp/dcc-bootstrap/bin:$PATH"
          # 第一阶段: 编译 dcc (用 host dcc),产物 dcc2
          /tmp/dcc-source/bin/dcc -std=gnu23 -O2 -o /tmp/dcc-bootstrap/dcc2 \
              /tmp/dcc-source/src/main.rs 2>&1 | tail -50 || \
              /bin/dcc -std=gnu23 -O2 -o /tmp/dcc-bootstrap/dcc2 /tmp/dcc-source/src/main.rs
          # 我们目前用 rustc 编 dcc,然后看未来能否用 dcc 编 dcc

      - name: Compare binaries
        if: success()
        run: |
          # 暂以 dcc (rustc 编) 跟同一份 dcc 源码二次 rustc 编出来的产物大小比较
          # 等到 M5 之后这里改成: dcc 编 dcc vs dcc2 编 dcc
          size1=$(stat -c%s bin/dcc)
          size2=$(stat -c%s /tmp/dcc-bootstrap/dcc2)
          echo "dcc (rustc)     = $size1 bytes"
          echo "dcc (rebuilt)   = $size2 bytes"

      - name: Summary
        if: always()
        run: |
          echo "## Bootstrap Status" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tool: dcc (host build via rustc)" >> $GITHUB_STEP_SUMMARY

  # ------------------------------------------------------------
  # Job 2: Linux 内核编译基准 (Free Runner)
  # 第一性原理: 编译器对比 = 同一份源码 + 同一份 config + 同一份 make 命令
  # ------------------------------------------------------------
  bench-free:
    name: "Kernel bench (free runner)"
    needs: bootstrap
    runs-on: ${{ inputs.use_paid_runner == 'true' && 'ubuntu-latest-8-cores' || 'ubuntu-latest' }}
    timeout-minutes: 90
    env:
      KVER: ${{ inputs.kernel_version || env.KERNEL_VERSION_DEFAULT }}
      OPT:  ${{ inputs.optimization_level || env.OPT_LEVEL_DEFAULT }}
      JOBS: ${{ inputs.parallel_jobs || env.PARALLEL_JOBS_DEFAULT }}
    steps:
      - name: Record system info
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "CPU: $(nproc) cores"
          echo "MEM: $(free -h | head -2 | tail -1)"
          echo "Kernel: $(uname -r)"

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev \
                                  bc cpio xz-utils python3 rsync

      - name: Build dcc
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          cargo build --release
          mkdir -p bin && cp target/release/dcc bin/dcc
          ./bin/dcc --version

      - name: Clone Linux kernel (shallow)
        run: |
          git clone --depth=1 --branch=v${KVER} \
              https://github.com/torvalds/linux.git linux-${KVER}
          cd linux-${KVER}
          echo "Kernel version: $(make kernelversion)"

      - name: Configure kernel (defconfig)
        run: |
          cd linux-${KVER}
          make defconfig
          # 减少 work: 关掉一些会引入 glibc/musl 依赖的选项
          scripts/config --disable CONFIG_MODULES
          scripts/config --disable CONFIG_SECURITY_APPARMOR
          make olddefconfig

      - name: GCC baseline (sanity)
        run: |
          cd linux-${KVER}
          make clean >/dev/null 2>&1
          echo "## GCC Baseline" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Time (s) |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----------|" >> $GITHUB_STEP_SUMMARY
          start=$(date +%s)
          make -j${JOBS} HOSTCFLAGS="-std=gnu11 -${OPT}" vmlinux 2>&1 | tail -5
          gcc_time=$(( $(date +%s) - start ))
          echo "| GCC -${OPT} (host) | $gcc_time |" >> $GITHUB_STEP_SUMMARY
          echo "GCC_TIME=$gcc_time" >> $GITHUB_ENV

      - name: DCC cold run
        run: |
          cd linux-${KVER}
          make clean >/dev/null 2>&1
          rm -rf ~/.dcc/cache
          start=$(date +%s)
          # 第一性原理: DCC 直接通过 HOSTCC 接入 make 流程
          make -j${JOBS} HOSTCC="$GITHUB_WORKSPACE/bin/dcc -std=gnu23 -${OPT}" vmlinux 2>&1 | tail -5
          dcc_cold_time=$(( $(date +%s) - start ))
          echo "DCC_COLD_TIME=$dcc_cold_time" >> $GITHUB_ENV
          echo "| DCC -${OPT} (cold) | $dcc_cold_time |" >> $GITHUB_STEP_SUMMARY

      - name: DCC warm run
        run: |
          cd linux-${KVER}
          make clean >/dev/null 2>&1
          start=$(date +%s)
          make -j${JOBS} HOSTCC="$GITHUB_WORKSPACE/bin/dcc -std=gnu23 -${OPT}" vmlinux 2>&1 | tail -5
          dcc_warm_time=$(( $(date +%s) - start ))
          echo "DCC_WARM_TIME=$dcc_warm_time" >> $GITHUB_ENV
          echo "| DCC -${OPT} (warm) | $dcc_warm_time |" >> $GITHUB_STEP_SUMMARY

      - name: vmlinux size
        run: |
          cd linux-${KVER}
          ls -la vmlinux
          echo "| vmlinux size | $(stat -c%s vmlinux) bytes |" >> $GITHUB_STEP_SUMMARY

      - name: Final summary
        if: always()
        run: |
          echo "## DCC Kernel Compilation Benchmark (Free Runner)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Runner | ${{ env.RUNNER_NAME }} ($(nproc) cores, $(free -h | head -2 | tail -1 | awk '{print $2}')) |" >> $GITHUB_STEP_SUMMARY
          echo "| Kernel | linux-${{ env.KVER }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Optimization | ${{ env.OPT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Parallel Jobs | -j${{ env.JOBS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GCC time (host) | ${{ env.GCC_TIME }}s |" >> $GITHUB_STEP_SUMMARY
          echo "| DCC cold time | ${{ env.DCC_COLD_TIME }}s |" >> $GITHUB_STEP_SUMMARY
          echo "| DCC warm time | ${{ env.DCC_WARM_TIME }}s |" >> $GITHUB_STEP_SUMMARY
          if [ -n "$GCC_TIME" ] && [ -n "$DCC_WARM_TIME" ] && [ "$GCC_TIME" -gt 0 ]; then
            speedup=$(echo "scale=2; $GCC_TIME / $DCC_WARM_TIME" | bc)
            echo "| Speedup (DCC/GCC) | ${speedup}x |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY

  # ------------------------------------------------------------
  # Job 3: 性能退化告警 - 如果 DCC 比上次慢 20%+, 创建 Issue
  # ------------------------------------------------------------
  regression-alert:
    name: "Performance regression check"
    needs: [bench-free, bootstrap]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download previous benchmark
        uses: actions/download-artifact@v4
        with:
          name: bench-results
          path: ./prev
        continue-on-error: true

      - name: Compare with history
        run: |
          # 极简: 读 summary 文件, 与上次 summary 对比
          # 如果缺失上次数据,跳过
          if [ -f ./prev/summary.txt ]; then
            prev=$(grep "DCC warm time" ./prev/summary.txt | grep -oE '[0-9]+')
            curr=$(echo "${{ env.DCC_WARM_TIME }}")
            if [ -n "$prev" ] && [ -n "$curr" ] && [ "$prev" -gt 0 ]; then
              ratio=$(echo "scale=2; $curr / $prev" | bc)
              echo "DCC_WARM_RATIO=$ratio"
              if [ "$(echo "$ratio > 1.2" | bc)" = "1" ]; then
                echo "::warning::DCC slow-down detected: ${ratio}x vs previous"
              fi
            fi
          else
            echo "No previous benchmark data found - skipping regression check"
          fi

      - name: Create regression issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "⚠️ DCC 性能退化告警";
            const body = [
              "## 性能退化报告",
              "",
              "- Commit: ${{ github.sha }}",
              "- Run: ${{ github.run_id }}",
              "- DCC warm time: ${{ env.DCC_WARM_TIME }}s",
              "",
              "请检查最近 commit 是否有性能 regression。"
            ].join("\n");
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ["performance", "regression"]
            });
