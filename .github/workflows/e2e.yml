# 第一性原理: e2e 验证——每个 example 编译+运行，验证退出码

name: dcc-e2e

on:
  push:
    branches: [main, develop, "feat/**", "perf/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: "End-to-end compile and run"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build dcc
        run: |
          cargo build --release
          mkdir -p bin && cp target/release/dcc bin/dcc
          ./bin/dcc --version

      - name: Run cargo tests (unit + integration + error snapshots)
        run: cargo test --release

      - name: Compile hello.c
        run: |
          ./bin/dcc -std=gnu23 -o hello examples/basics/hello.c
          chmod +x hello
          rc=0; ./hello || rc=$?
          echo "exit code: $rc"
          test $rc -eq 42

      - name: Compile arith.c
        run: |
          ./bin/dcc -std=gnu23 -o arith examples/basics/arith.c
          chmod +x arith
          rc=0; ./arith || rc=$?
          echo "arith exit: $rc"
          test $rc -eq 23

      - name: Compile control.c
        run: |
          ./bin/dcc -std=gnu23 -o control examples/basics/control_flow.c
          chmod +x control
          rc=0; ./control || rc=$?
          echo "control exit: $rc"
          test $rc -eq 100

      - name: Compile call.c
        run: |
          ./bin/dcc -std=gnu23 -o call examples/pointers/call_by_assign.c
          chmod +x call
          rc=0; ./call || rc=$?
          echo "call exit: $rc"
          test $rc -eq 20

      - name: Test error diagnostics
        run: |
          out=$(./bin/dcc -std=gnu23 -o /tmp/should_fail examples/advanced/bad_syntax.c 2>&1 || true)
          echo "$out" | head -20
          echo "$out" | grep -q 'error\[E0006\]'
          echo "$out" | grep -q 'hint:'

      - name: Summary
        if: always()
        run: |
          echo "## DCC e2e Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Example | Expected | Got | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|----------|-----|--------|" >> $GITHUB_STEP_SUMMARY
          hello_rc=0; ./hello || hello_rc=$?  || true
          arith_rc=0; ./arith || arith_rc=$?   || true
          control_rc=0; ./control || control_rc=$? || true
          call_rc=0; ./call || call_rc=$?      || true
          echo "| hello.c | 42 | $hello_rc | $([ $hello_rc -eq 42 ] && echo PASS || echo FAIL) |" >> $GITHUB_STEP_SUMMARY
          echo "| arith.c | 23 | $arith_rc | $([ $arith_rc -eq 23 ] && echo PASS || echo FAIL) |" >> $GITHUB_STEP_SUMMARY
          echo "| control.c | 100 | $control_rc | $([ $control_rc -eq 100 ] && echo PASS || echo FAIL) |" >> $GITHUB_STEP_SUMMARY
          echo "| call.c | 20 | $call_rc | $([ $call_rc -eq 20 ] && echo PASS || echo FAIL) |" >> $GITHUB_STEP_SUMMARY
