# Check feature matrix - 后端能力矩阵门禁
# 第一性原理：能力矩阵的 truth 是 dcc 的**产物指纹**，不是文档也不是 features.rs。
#
# 为什么重写（旧版三条实测缺陷）：
#   1) `-o md >> docs/backend_feature_matrix.md` 是**追加**，每跑一次矩阵就长一截，
#      且随后 "Commit updated matrix" 会把这种污染固化进历史；文档里残留的
#      `$(date -Iseconds)` 字面量正是这套流程的产物（那行从来不会被 shell 展开）。
#   2) "Verify matrix file exists" 只判断文件在不在——**没有任何 diff 断言**，
#      等于把门禁降级成存在性检查。
#   3) "Validate registry consistency" 用 grep 数 `Arch::...` 出现次数，本地恒得
#      expected=22 / actual=6 → **结构性恒红**，且红的原因与真实缺陷无关。
#      现在这一步的等价断言已经移进探针脚本（从 cli.rs::Arch::ALL/has_backend 与
#      registry.rs::backend_for() 的 `Some(` 分支**同源推导**，不写任何魔法数字），
#      所以这里不再重复抄一份会腐烂的算法。
#
# 探针退出码语义（与 scripts/probe_backend_features.sh 头部一致），CI 按它分两个步骤：
#   0 -> 全绿
#   1 -> 能力矩阵说谎（文档漂移 / artifact 级实测 NO 却仍声明）-> 必须当场修，不许留
#   3 -> 三方一致，但存在容器不可解析的后端产物（现状：mips64 .o 被 objdump 拒绝，
#        `e_ident[EI_DATA]=ELFDATA2MSB` 而头字段按小端写）-> 用独立步骤保持为
#        **有原因的红**，与 tests/integration.rs 里 `non_x86_c_mode_produces_valid_elf`
#        是同一个事实；解锁条件 = 修掉该端序矛盾。
# 不把两者混成一个退出码，是为了让「矩阵一致性」这道门禁现在就能真正成立：
# 长期红而无差别按下的门禁，会和旧版那个 `expected_backends=22` 一样最终被忽略。

name: check-feature-matrix

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check_matrix:
    name: "Check feature matrix vs reality"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # 探针只在**宿主** binutils 上跑 readelf/objdump（通用 elf64-little /
      # elf32-big 等 BFD target 足以解析交叉产物），不需要任何交叉 gcc。
      # 旧版装 6 个 gcc-* 包是无效依赖。
      - name: Install binutils (probe dependency)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils

      - name: Build dcc
        run: cargo build --release

      - name: Assert matrix consistency (artifact == doc == declared)
        # 只允许 0 / 3：3 代表「矩阵本身诚实，但有一个已知破损后端」，
        # 由下一步骤单独判红。任何 1（矩阵说谎）在这一步就直接失败。
        run: |
          set +e
          bash scripts/probe_backend_features.sh \
            --check docs/backend_feature_matrix.md -o none \
            > /tmp/probe_stdout.txt 2> /tmp/probe_stderr.txt
          rc=$?
          set -e
          cat /tmp/probe_stdout.txt
          cat /tmp/probe_stderr.txt
          {
            echo "## Feature matrix probe"
            echo ""
            echo 'probe exit code = '$rc
            echo ''
            grep -E '^(FAIL|警告|错误|OK|Probe)' /tmp/probe_stderr.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" = 0 ] || [ "$rc" = 3 ]; then
            echo "PROBE_RC=$rc" >> "$GITHUB_ENV"
            echo "能力矩阵三方一致（实测 == 文档 == FeatureSet 声明），probe rc=$rc"
          else
            echo "::error::能力矩阵与实测不一致（文档漂移 / 言过其实），probe rc=$rc"
            exit 1
          fi

      - name: Assert every registered backend emits a parseable object
        # rc=3 的真相在这里报。故意不用 continue-on-error：
        # 「可以忽略的已知缺陷」与「假绿灯」只一纸之隔，按下比不修更贵。
        run: |
          if [ "${PROBE_RC:-0}" = 3 ]; then
            echo "::error::存在容器不可解析的后端产物："
            grep -A 4 '容器不可解析' /tmp/probe_stderr.txt || true
            echo "解锁条件见 docs/backend_feature_matrix.md「当前唯一的红」一节。"
            exit 1
          fi
          echo "全部已注册后端的 -c 产物均可被宿主 binutils 解析"

      - name: Publish raw probe evidence
        if: always()
        run: |
          mkdir -p ./probe-artifacts
          bash scripts/probe_backend_features.sh -o tsv > ./probe-artifacts/features_probe.tsv
          # 只留一份机器可读快照供人查，不再往仓库里追加/提交任何东西。

      - name: Archive probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-probe-results
          path: |
            probe-artifacts/features_probe.tsv
          retention-days: 30
