name: GCC Torture Test

on:
  workflow_dispatch:

jobs:
  torture-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build dcc
        run: cargo build --release

      - name: Download GCC torture suite
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/gcc-mirror/gcc.git tests/gcc-torture
          cd tests/gcc-torture && git sparse-checkout set \
            gcc/testsuite/gcc.c-torture/execute \
            gcc/testsuite/gcc.c-torture/compile

      - name: Run compile tests
        # 旧写法 `bash scripts/x.sh 2>&1 | tee log || true` 有两层掩盖:
        #   1) 默认 shell 是 `bash -e {0}`, 没有 pipefail —— 管道退出码取 tee, 恒 0;
        #   2) 末尾的 `|| true` 把剩下的一切非 0 也按掉, 于是「脚本不存在 / 语法错 /
        #      跑出非 0 / 全绿」四种事实在 CI 里长得一模一样。
        # 现在先显式证明脚本存在且可解析, 再把真实 rc 落到日志与 step 输出。
        # 套件本身的失败不判红(新编译器上它会长期红, 长期红的门禁等于没有门禁),
        # 但「压根没跑起来」必须红。
        run: |
          s=scripts/torture_compile_test.sh
          [ -f "$s" ] || { echo "::error::$s 不存在"; exit 1; }
          bash -n "$s" || { echo "::error::$s 语法错误"; exit 1; }
          rc=0
          bash "$s" > compile_test.log 2>&1 || rc=$?
          tail -30 compile_test.log
          echo "torture_compile_test.sh rc=$rc"
          if [ "$rc" -ge 126 ]; then
            echo "::error::$s 无法执行 (rc=$rc)"
            exit 1
          fi

      - name: Run execute tests
        run: |
          s=scripts/torture_execute_test.sh
          [ -f "$s" ] || { echo "::error::$s 不存在"; exit 1; }
          bash -n "$s" || { echo "::error::$s 语法错误"; exit 1; }
          rc=0
          bash "$s" > execute_test.log 2>&1 || rc=$?
          tail -30 execute_test.log
          echo "torture_execute_test.sh rc=$rc"
          if [ "$rc" -ge 126 ]; then
            echo "::error::$s 无法执行 (rc=$rc)"
            exit 1
          fi

      - name: Generate summary
        if: always()
        run: bash scripts/torture_summary.sh compile_test.log execute_test.log >> "$GITHUB_STEP_SUMMARY"
