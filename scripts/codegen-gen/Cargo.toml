[package]
name = "codegen-gen"
version = "0.1.0"
edition = "2021"
description = "Data-driven instruction encoding code generator for DCC compiler"
license = "MIT OR Apache-2.0"

# Exclude from parent workspace to avoid conflicts
[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
chrono = "0.4"
tera = "1.18"

[dev-dependencies]
tempfile = "3.8"

[[bin]]
name = "codegen-gen"
path = "src/main.rs"
