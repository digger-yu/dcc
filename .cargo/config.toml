# Cargo configuration for static linking with musl
#
# This configuration enables building dcc as a fully static binary
# that doesn't depend on the host's dynamic linker (ld.so).
#
# Usage:
#   1. Install musl target: rustup target add x86_64-unknown-linux-musl
#   2. Build: cargo build --release --target x86_64-unknown-linux-musl
#
# The resulting binary will be in:
#   target/x86_64-unknown-linux-musl/release/dcc

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

[target.riscv64gc-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]
