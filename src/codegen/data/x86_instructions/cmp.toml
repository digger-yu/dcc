[package]
name = "cmp"
version = "1.0.0"
description = "Compare - Compares two operands by performing implicit subtraction and setting status flags"

arch = "x8664"
aliases = ["CMP"]

# Operands specification
[[operands]]
name = "dest"
op_type = "regmem"
direction = "read"
size = "32bit_or_64bit"
description = "Destination operand (not modified)"

[[operands]]
name = "src"
op_type = "regmemimmediate"
direction = "read"
size = "32bit_or_64bit"
description = "Source operand (not modified)"

# Encoding specifications
[encoding_spec]
default_format = "RegMemReg"

# Available encoding formats
[[encoding_spec.formats]]
name = "RegMemReg"
description = "Register to register or memory to register comparison"
operand_pattern = "r/m r"
opcode = [159, 0]
modrm_required = true
rex_prefix = true
addressing_mode = "standard_x86"

[[encoding_spec.formats]]
name = "RegImm"
description = "Immediate value to register comparison"
operand_pattern = "imm r/m"
opcode = [150, 0]
modrm_required = true
rex_prefix = true
extra_bytes = true

[[encoding_spec.formats]]
name = "AccumulatorImm"
description = "Immediate to accumulator comparison (special form)"
operand_pattern = "imm al"
opcode = [144]
modrm_required = false
rex_prefix = false
special_case = true

# Instruction semantics
class_semantics.effect = "flags = (dest - src)"
class_semantics.flags_modified = ["OF", "SF", "ZF", "AF", "PF", "CF"]
class_semantics.cpu_modes = ["real", "protected", "long"]
