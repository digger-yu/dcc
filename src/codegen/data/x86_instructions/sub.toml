[package]
name = "sub"
version = "1.0.0"
description = "Integer subtraction - Subtracts source from destination operand and stores result in destination"

arch = "x8664"
aliases = ["SUB"]

# Operands specification
[[operands]]
name = "dest"
op_type = "regmem"
direction = "readwrite"
size = "32bit_or_64bit"
description = "Destination register or memory location"

[[operands]]
name = "src"
op_type = "regmemimmediate"
direction = "read"
size = "32bit_or_64bit"
description = "Source register, memory, or immediate value"

# Encoding specifications
[encoding_spec]
default_format = "RegMemReg"

# Available encoding formats
[[encoding_spec.formats]]
name = "RegMemReg"
description = "Register to register or memory to register subtraction"
operand_pattern = "r/m r"
opcode = [227, 0]
modrm_required = true
rex_prefix = true
addressing_mode = "standard_x86"

[[encoding_spec.formats]]
name = "RegImm"
description = "Immediate value to register subtraction"
operand_pattern = "imm r/m"
opcode = [215, 0]
modrm_required = true
rex_prefix = true
extra_bytes = true

# Instruction semantics
class_semantics.effect = "dest = dest - src"
class_semantics.flags_modified = ["OF", "SF", "ZF", "AF", "PF", "CF"]
class_semantics.exceptions = ["#GP", "#BP"]
class_semantics.cpu_modes = ["real", "protected", "long"]
