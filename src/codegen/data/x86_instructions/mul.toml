[package]
name = "mul"
version = "1.0.0"
description = "Integer multiplication - Multiplies operands and stores result in destination"

arch = "x8664"
aliases = ["IMUL"]

# Operands specification
[[operands]]
name = "dest"
op_type = "reg"
direction = "readwrite"
size = "32bit_or_64bit"
description = "Destination register"

[[operands]]
name = "src"
op_type = "regmemimmediate"
direction = "read"
size = "32bit_or_64bit"
description = "Source register, memory, or immediate value"

# Encoding specifications
[encoding_spec]
default_format = "RegReg"

# Available encoding formats
[[encoding_spec.formats]]
name = "RegReg"
description = "Register to register multiplication"
operand_pattern = "r r/m"
opcode = [251]
modrm_required = true
rex_prefix = true

[[encoding_spec.formats]]
name = "RegImm"
description = "Immediate value to register multiplication"
operand_pattern = "imm r/m"
opcode = [215, 0]
modrm_required = true
rex_prefix = true
extra_bytes = true

# Instruction semantics
class_semantics.effect = "dest = dest * src"
class_semantics.flags_modified = ["OF", "CF"]
class_semantics.cpu_modes = ["real", "protected", "long"]
